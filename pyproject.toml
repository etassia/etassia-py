[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etassia"
# Ride ritual: `version` and src/etassia/etassia-rs-version.txt (the pinned
# etassia-rs engine commit) are bumped together in one ride commit. Every
# wheel vendors the cdylib built from that exact commit, and the audit job
# asserts the version PyPI served equals this file's value.
version = "0.1.0"
description = "Python binding for the etassia diagram engine: Mermaid-syntax diagram sources rendered to SVG through the etassia C ABI"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.9"
# NOTE: the Python floor and the PyPI name are OWNER decisions; this
# skeleton uses the conservative default so CI can run everywhere.
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/etassia/etassia-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etassia = ["lib/*.so", "lib/*.dylib", "lib/*.dll", "etassia-rs-version.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
